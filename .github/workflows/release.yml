name: Build & Publish Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode release keystore (if configured in secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run unit tests & build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Rename Release APK
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "AW-Anime-${TAG_NAME}.apk"
          sha256sum "AW-Anime-${TAG_NAME}.apk" > "AW-Anime-${TAG_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "AW Anime ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            AW-Anime-*.apk
            AW-Anime-*.apk.sha256
