name: Build & Publish Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Decode release keystore (if configured in secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.jks"
            test -s "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set, falling back to debug signing."
          fi

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run unit tests & build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Verify APK signature & rename Release APK
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK_SRC")"
            echo "$CERT_INFO"
            if [ -n "${KEYSTORE_FILE:-}" ] && echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
              echo "ERROR: APK was signed with debug key despite KEYSTORE_FILE being configured!"
              exit 1
            fi
          fi
          cp "$APK_SRC" "AW-Anime-${TAG_NAME}.apk"
          sha256sum "AW-Anime-${TAG_NAME}.apk" > "AW-Anime-${TAG_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "AW Anime ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            AW-Anime-*.apk
            AW-Anime-*.apk.sha256
